name: Reopen commissions

on:
  push:
    paths:
      - '.github/workflows/reopen-commissions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set commissions open
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="commission-status closed" href="#pricing"><i></i>COMMISSIONS CLOSED</a>'
          new = '<a class="commission-status" href="#pricing"><i></i>COMMISSIONS OPEN</a>'
          if old not in s:
              raise SystemExit('Commission closed marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reopen-commissions.yml
          git add index.html
          git commit -m "Reopen commissions"
          git push
