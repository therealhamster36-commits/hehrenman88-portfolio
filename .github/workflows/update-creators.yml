name: Update creator count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-creators.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update creator count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="stat"><strong>01</strong>Creator</div>'
          new = '<div class="stat"><strong>02</strong>Creators</div>'
          if old not in s:
              raise SystemExit('Creator stat not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-creators.yml
          git add index.html
          git commit -m "Update creator count to 2"
          git push
